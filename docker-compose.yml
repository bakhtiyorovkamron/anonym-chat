services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anonym
      POSTGRES_PASSWORD: anonym
      POSTGRES_DB: anonym_chat
    ports:
      - "5430:5432" # host:container. Postgres inside the container always listens on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anonym -d anonym_chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: anonym-chat:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      # Inside the Docker network the database is reachable as "db:5432", not localhost:5430.
      DATABASE_URL: postgresql://anonym:anonym@db:5432/anonym_chat?schema=public
      # Taken from the .env file next to this compose file. Compose refuses to start if they are missing.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is not set in .env}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is not set in .env}
      # Origins allowed to open a Socket.IO connection. Add your domain / LAN address here, comma-separated.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4000}
      # Set COOKIE_SECURE=false in .env only while serving over plain HTTP (no HTTPS yet).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PORT: 4000
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
